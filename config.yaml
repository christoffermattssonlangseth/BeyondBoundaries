  run6: /Volumes/moldiassd/20260506__112634__GoncaloTing_5kMouse_run6
exclude_regions: ["ON_*", "D_SC"]   # optic nerve (out of scope); D_SC not annotated

# laptop: ~/Downloads/RRMAP2_xenium_all_samples.cellcharter.companion.ready.with_metadata.rerun.with_AnnoL1Curated_with_Region_Anno2to4Updated.h5ad
annotation:
